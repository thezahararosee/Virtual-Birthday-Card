<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-front">
                <h1>Happy Birthday, <span id="recipientName">friend</span>!</h1>
                <div class="cake-icon">🎂</div>
                <p>Click to Open</p>
            </div>
            <div class="card-inside">
                <h2>Wishing you the best!</h2>
                <p>Although I can't be there in person, I'm sending all my love and best wishes to you on your special day.</p>
                <p>I hope this year brings you all your manifestations, good health, and happiness!</p>
                <p class="signature">Love, Zahara</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
